document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

humb{background:var(--line2);border-radius:6px} ::-webkit-scrollbar-track{background:var(--bg2)}\n  input,select,button{color:inherit}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden;background:var(--bg)\">\n  <header style=\"display:flex;align-items:center;gap:16px;padding:11px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap\">\n    <span style=\"font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--ink)\">Eastern Front<span style=\"color:var(--red)\">/<\u002Fspan>Assembly<\u002Fspan>\n    <span style=\"font-family:'Martian Mono';font-weight:300;font-size:9px;color:var(--ink3);letter-spacing:-.04em\">137 HIGHLIGHTS AS CUTTABLE MATERIAL<\u002Fspan>\n    <input type=\"search\" value=\"{{ q }}\" sc-camel-on-change=\"{{ onQ }}\" placeholder=\"filter material…\" style=\"background:var(--card);border:1px solid var(--line2);padding:5px 10px;font-size:12px;width:180px;font-family:inherit;border-radius:2px\">\n    <div style=\"display:flex;gap:4px;flex-wrap:wrap\">\n      <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ c.pick }}\" style=\"font-family:'Martian Mono';font-weight:300;font-size:9px;letter-spacing:-.04em;padding:4px 7px;border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }};cursor:pointer;border-radius:2px\" style-hover=\"border-color:var(--gold)\">{{ c.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;gap:14px;align-items:center;font-family:'Martian Mono';font-weight:300;font-size:9px;letter-spacing:-.04em;color:var(--ink3)\">\n      <span><span style=\"display:inline-block;width:7px;height:7px;background:var(--red);margin-right:5px\"><\u002Fspan>READWISE<\u002Fspan>\n      <span><span style=\"display:inline-block;width:7px;height:7px;background:var(--gold);margin-right:5px\"><\u002Fspan>SIDENOTES<\u002Fspan>\n      <span style=\"display:flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden\">\n        <button sc-camel-on-click=\"{{ setDark }}\" style=\"background:{{ darkBg }};color:{{ darkFg }};border:none;padding:4px 8px;cursor:pointer;font-family:inherit;font-size:9px;letter-spacing:-.04em\">DARK<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ setLight }}\" style=\"background:{{ lightBg }};color:{{ lightFg }};border:none;padding:4px 8px;cursor:pointer;font-family:inherit;font-size:9px;letter-spacing:-.04em\">LIGHT<\u002Fbutton>\n      <\u002Fspan>\n      <span>A · B · <a href=\"Eastern Front C - Broadsheet.dc.html\">C<\u002Fa> · <b style=\"color:var(--ink)\">D<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <div style=\"display:flex;align-items:stretch;height:32px;border-bottom:1px solid var(--line);background:var(--bg2)\">\n    <sc-for list=\"{{ actBands }}\" as=\"ab\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ ab.jump }}\" style=\"flex:{{ ab.flex }};background:{{ ab.bg }};border:none;border-right:1px solid var(--bg);color:{{ ab.fg }};cursor:pointer;font-family:'Martian Mono';font-weight:500;font-size:9px;letter-spacing:-.04em;text-align:left;padding:0 12px;overflow:hidden;white-space:nowrap\" style-hover=\"opacity:.75\">{{ ab.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div id=\"track\" style=\"overflow-x:auto;overflow-y:hidden;display:flex;align-items:stretch\">\n    <sc-for list=\"{{ columns }}\" as=\"col\" hint-placeholder-count=\"6\">\n      <section id=\"{{ col.anchor }}\" data-screen-label=\"{{ col.title }}\" style=\"width:320px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;background:{{ col.colBg }}\">\n        <div style=\"padding:12px 14px;border-bottom:1px solid var(--line);border-top:3px solid {{ col.accent }};background:var(--bg2)\">\n          <div style=\"font-family:'Martian Mono';font-weight:500;font-size:9px;letter-spacing:-.04em;color:{{ col.accent }}\">{{ col.date }}<\u002Fdiv>\n          <div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:23px;line-height:1.12;margin-top:4px;color:var(--quote)\">{{ col.title }}<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:var(--ink3);margin-top:6px;line-height:1.45\">{{ col.badgeEp }}<\u002Fdiv>\n          <div style=\"font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:13px;color:var(--ink2);margin-top:3px\">{{ col.beat }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ col.hls }}\" as=\"hl\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ hl.open }}\" style=\"text-align:left;background:{{ hl.cardBg }};border:1px solid {{ hl.cardBd }};border-left:3px solid {{ hl.edge }};padding:10px 11px;cursor:pointer;font-family:inherit;border-radius:2px;display:block;width:100%\" style-hover=\"border-color:var(--ink4)\">\n              <div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:15.5px;line-height:1.35;color:var(--quote)\">{{ hl.snip }}<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;align-items:center;margin-top:8px;font-family:'Martian Mono';font-weight:300;font-size:8.5px;letter-spacing:-.04em;color:var(--ink3)\">\n                <span>{{ hl.book }}<\u002Fspan>\n                <span style=\"margin-left:auto\">{{ hl.runtime }}<\u002Fspan>\n                <span style=\"color:var(--gold)\">{{ hl.inCutMark }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ col.empty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11px;color:var(--ink4);padding:8px 2px\">nothing in this event matches<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-for>\n    <div style=\"width:300px;flex:none;padding:22px 20px;color:var(--ink3);font-size:12px;line-height:1.65\">\n      <div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:24px;color:var(--ink2);line-height:1.1\">End of material.<\u002Fdiv>\n      <p style=\"margin:12px 0 0\">Scroll right through the war; each column is one event, each card one highlight. Click a card to read it whole and drop it into the cut below. Runtimes are narration estimates at 155&nbsp;wpm.<\u002Fp>\n      <p style=\"margin:12px 0 0\">↑↓ inside a column · ←→ between columns.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--line);background:var(--bg2);min-height:118px;display:flex;flex-direction:column\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding:8px 20px;border-bottom:1px solid var(--line)\">\n      <span style=\"font-family:'Bricolage Grotesque';font-weight:800;font-size:13px;letter-spacing:-.02em;color:var(--gold)\">Your cut<\u002Fspan>\n      <span style=\"font-family:'Martian Mono';font-weight:300;font-size:9.5px;letter-spacing:-.04em;color:var(--ink3)\">{{ cutCount }} CARDS · EST. {{ cutRuntime }}<\u002Fspan>\n      <div style=\"flex:1;height:4px;background:var(--line);border-radius:2px;max-width:340px;overflow:hidden\"><div style=\"height:100%;width:{{ cutPct }};background:var(--red)\"><\u002Fdiv><\u002Fdiv>\n      <span style=\"font-family:'Martian Mono';font-weight:300;font-size:9px;letter-spacing:-.04em;color:var(--ink4)\">{{ cutTargetLabel }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ clearCut }}\" style=\"margin-left:auto;background:none;border:1px solid var(--line2);color:var(--ink3);font-family:'Martian Mono';font-weight:300;font-size:9px;letter-spacing:-.04em;padding:5px 9px;cursor:pointer;border-radius:2px\" style-hover=\"color:var(--red);border-color:var(--red)\">CLEAR<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;overflow-x:auto;display:flex;gap:8px;padding:10px 20px;align-items:stretch\">\n      <sc-for list=\"{{ cut }}\" as=\"cc\" hint-placeholder-count=\"0\">\n        <div style=\"width:214px;flex:none;background:var(--card);border:1px solid var(--line2);border-left:3px solid {{ cc.edge }};padding:8px 10px;border-radius:2px;display:flex;flex-direction:column\">\n          <div style=\"font-family:'Martian Mono';font-weight:300;font-size:8.5px;letter-spacing:-.04em;color:var(--ink3);display:flex;gap:6px\"><span>{{ cc.pos }}<\u002Fspan><span style=\"color:var(--ink4)\">{{ cc.event }}<\u002Fspan><span style=\"margin-left:auto;color:var(--gold)\">{{ cc.runtime }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:14px;line-height:1.3;color:var(--quote);margin-top:6px;flex:1\">{{ cc.snip }}<\u002Fdiv>\n          <div style=\"display:flex;gap:4px;margin-top:6px\">\n            <button sc-camel-on-click=\"{{ cc.up }}\" style=\"background:none;border:1px solid var(--line2);color:var(--ink3);font-size:9.5px;padding:2px 6px;cursor:pointer;font-family:inherit\" style-hover=\"color:var(--ink)\">◀<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ cc.down }}\" style=\"background:none;border:1px solid var(--line2);color:var(--ink3);font-size:9.5px;padding:2px 6px;cursor:pointer;font-family:inherit\" style-hover=\"color:var(--ink)\">▶<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ cc.remove }}\" style=\"margin-left:auto;background:none;border:1px solid var(--line2);color:var(--ink3);font-family:'Martian Mono';font-weight:300;font-size:8.5px;letter-spacing:-.04em;padding:2px 6px;cursor:pointer\" style-hover=\"color:var(--red);border-color:var(--red)\">REMOVE<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ cutEmpty }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:16px;color:var(--ink3);align-self:center\">Empty. Open a card and press “Add to cut” to start assembling an episode.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ detailOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;background:var(--shade);z-index:80\" sc-camel-on-click=\"{{ closeDetail }}\"><\u002Fdiv>\n  <aside style=\"position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:var(--panel);border-left:1px solid var(--line2);z-index:81;display:flex;flex-direction:column\">\n    <div style=\"padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px\">\n      <div>\n        <div style=\"font-family:'Martian Mono';font-weight:500;font-size:9px;letter-spacing:-.04em;color:{{ detail.accent }}\">{{ detail.eventDate }}<\u002Fdiv>\n        <div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:26px;color:var(--quote);margin-top:3px;line-height:1.1\">{{ detail.eventTitle }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeDetail }}\" style=\"margin-left:auto;background:none;border:1px solid var(--line2);color:var(--ink3);font-family:'Martian Mono';font-weight:300;font-size:9px;letter-spacing:-.04em;padding:5px 10px;cursor:pointer;border-radius:2px\" style-hover=\"color:var(--ink)\">CLOSE ✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;overflow-y:auto;padding:22px\">\n      <blockquote style=\"margin:0;font-family:'Instrument Serif',Georgia,serif;font-size:21px;line-height:1.45;color:var(--quote);border-left:3px solid {{ detail.edge }};padding-left:16px;white-space:pre-line\">{{ detail.quote }}<\u002Fblockquote>\n      <div style=\"margin-top:16px;font-size:12px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n        <span style=\"font-weight:600;color:var(--ink)\">{{ detail.book }}<\u002Fspan><span>{{ detail.authorLine }}<\u002Fspan>\n        <sc-for list=\"{{ detail.tagObjs }}\" as=\"tg\" hint-placeholder-count=\"0\"><span style=\"color:{{ tg.fg }};font-family:'Martian Mono';font-weight:300;font-size:9px;letter-spacing:-.04em\">#{{ tg.t }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ detail.hasUse }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:16px;border:1px solid var(--line2);background:var(--card);padding:12px 14px\">\n          <div style=\"font-family:'Martian Mono';font-weight:500;font-size:9px;letter-spacing:-.04em;color:var(--ink3)\">USE<\u002Fdiv>\n          <div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:16px;color:var(--usefg);margin-top:6px;line-height:1.45\">{{ detail.use }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"margin-top:16px;font-size:11.5px;color:var(--ink3);line-height:1.7\">\n        <div>Beat — <span style=\"color:var(--gold)\">{{ detail.beat }}<\u002Fspan><\u002Fdiv>\n        <div>Series slot — {{ detail.badgeEp }}<\u002Fdiv>\n        <div>Est. narration — {{ detail.runtime }} ({{ detail.words }} words)<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ detail.hasRw }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:14px\"><a href=\"{{ detail.rw }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px\">Open in Readwise ↗<\u002Fa><\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center\">\n      <button sc-camel-on-click=\"{{ detail.toggleCut }}\" style=\"background:{{ detail.cutBtnBg }};border:1px solid var(--red);color:{{ detail.cutBtnFg }};font-family:'Martian Mono';font-weight:500;font-size:10px;letter-spacing:-.04em;padding:10px 16px;cursor:pointer;border-radius:2px\">{{ detail.cutBtnLabel }}<\u002Fbutton>\n      <span style=\"font-family:'Martian Mono';font-weight:300;font-size:9px;letter-spacing:-.04em;color:var(--ink3)\">{{ detail.prevNextHint }}<\u002Fspan>\n      <div style=\"margin-left:auto;display:flex;gap:6px\">\n        <button sc-camel-on-click=\"{{ detail.prev }}\" style=\"background:none;border:1px solid var(--line2);color:var(--ink2);font-size:11px;padding:7px 11px;cursor:pointer;font-family:inherit\" style-hover=\"color:var(--ink)\">◀ prev<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ detail.next }}\" style=\"background:none;border:1px solid var(--line2);color:var(--ink2);font-size:11px;padding:7px 11px;cursor:pointer;font-family:inherit\" style-hover=\"color:var(--ink)\">next ▶<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst ACCENTS = ['var(--red)', 'var(--gold)', 'var(--teal)', 'var(--olive)'];\nclass Component extends DCLogic {\n  state = { data: null, q: '', tag: '', sel: null, cut: [], theme: 'dark' };\n  componentDidMount() {\n    fetch((window.__resources && window.__resources.hlData) || './highlights-data.json').then(r => r.json()).then(data => this.setState({ data }));\n    try { const c = JSON.parse(localStorage.getItem('ef-assembly-cut') || '[]'); if (Array.isArray(c)) this.setState({ cut: c }); } catch (e) {}\n    let th = 'dark';\n    try { th = localStorage.getItem('ef-assembly-theme') || 'dark'; } catch (e) {}\n    this.applyTheme(th);\n    this._key = e => {\n      const track = document.getElementById('track');\n      if (!track) return;\n      if (e.key === 'ArrowRight') track.scrollBy({ left: 320, behavior: 'smooth' });\n      else if (e.key === 'ArrowLeft') track.scrollBy({ left: -320, behavior: 'smooth' });\n      else if (e.key === 'Escape') this.setState({ sel: null });\n    };\n    window.addEventListener('keydown', this._key);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._key); }\n  applyTheme(theme) {\n    document.documentElement.setAttribute('data-theme', theme);\n    this.setState({ theme });\n    try { localStorage.setItem('ef-assembly-theme', theme); } catch (e) {}\n  }\n  saveCut(cut) { this.setState({ cut }); try { localStorage.setItem('ef-assembly-cut', JSON.stringify(cut)); } catch (e) {} }\n  words(t) { return t.trim().split(/\\s+/).length; }\n  secs(t) { return Math.round(this.words(t) / 2.58); }\n  rt(t) { const s = this.secs(t); return s < 60 ? s + 'S' : Math.floor(s / 60) + 'M' + String(s % 60).padStart(2, '0'); }\n  flat() {\n    const d = this.state.data; if (!d) return [];\n    const out = [];\n    d.acts.forEach((a, ai) => a.events.forEach((e, ei) => e.hls.forEach((h, hi) => out.push({ h, e, a, ai, key: ai + '-' + ei + '-' + hi }))));\n    return out;\n  }\n  renderVals() {\n    const s = this.state, d = s.data;\n    const q = s.q.trim().toLowerCase();\n    const all = this.flat();\n    const match = r => (!q || (r.h.quote + ' ' + r.h.book + ' ' + r.e.title).toLowerCase().includes(q)) && (!s.tag || r.h.tags.includes(s.tag));\n    const columns = [];\n    if (d) d.acts.forEach((a, ai) => a.events.forEach((e, ei) => {\n      const accent = ACCENTS[ai % 4];\n      const hls = e.hls.map((h, hi) => ({ r: { h, e, a, ai, key: ai + '-' + ei + '-' + hi } })).filter(x => match(x.r)).map(x => {\n        const h = x.r.h, inCut = s.cut.includes(x.r.key), on = s.sel === x.r.key;\n        return {\n          snip: h.quote.length > 132 ? h.quote.slice(0, 130).replace(/\\s+\\S*$/, '') + '…' : h.quote,\n          book: h.book.toUpperCase(), edge: h.sn ? 'var(--gold)' : 'var(--red)',\n          runtime: this.rt(h.quote),\n          inCutMark: inCut ? '● IN CUT' : '',\n          cardBg: on ? 'var(--cardhi)' : 'var(--card)',\n          cardBd: on ? 'var(--ink4)' : 'var(--line2)',\n          open: () => this.setState({ sel: x.r.key })\n        };\n      });\n      columns.push({\n        anchor: 'col-' + ai + '-' + ei, date: e.date.toUpperCase(), title: e.title, badgeEp: e.badgeEp, beat: e.beat,\n        accent, colBg: ai % 2 ? 'var(--colB)' : 'var(--colA)', hls, empty: hls.length === 0\n      });\n    }));\n    const cutRows = s.cut.map(k => all.find(r => r.key === k)).filter(Boolean);\n    const totalSecs = cutRows.reduce((n, r) => n + this.secs(r.h.quote), 0);\n    const fmt = sec => Math.floor(sec / 60) + 'M' + String(sec % 60).padStart(2, '0') + 'S';\n    const selRow = all.find(r => r.key === s.sel);\n    const idx = all.findIndex(r => r.key === s.sel);\n    const light = s.theme === 'light';\n    return {\n      q: s.q, onQ: e => this.setState({ q: e.target.value }),\n      setDark: () => this.applyTheme('dark'), setLight: () => this.applyTheme('light'),\n      darkBg: light ? 'transparent' : 'var(--ink)', darkFg: light ? 'var(--ink3)' : 'var(--bg)',\n      lightBg: light ? 'var(--ink)' : 'transparent', lightFg: light ? 'var(--bg)' : 'var(--ink3)',\n      chips: d ? d.chips.map(c => {\n        const on = s.tag === c.tag;\n        return { label: c.label.replace(' · ', ' ').toUpperCase(), pick: () => this.setState({ tag: c.tag }), bg: on ? 'var(--red)' : 'transparent', fg: on ? 'var(--btnfg)' : 'var(--ink3)', bd: on ? 'var(--red)' : 'var(--line2)' };\n      }) : [],\n      actBands: d ? d.acts.map((a, ai) => ({\n        label: a.num + ' · ' + a.title.toUpperCase() + ' — ' + a.subtitle + '  ' + a.frame,\n        flex: a.events.length, bg: ai % 2 ? 'var(--card)' : 'var(--panel)', fg: ACCENTS[ai % 4],\n        jump: () => { const el = document.getElementById('col-' + ai + '-0'), t = document.getElementById('track'); if (el && t) t.scrollTo({ left: el.offsetLeft, behavior: 'smooth' }); }\n      })) : [],\n      columns,\n      cut: cutRows.map((r, i) => ({\n        pos: String(i + 1).padStart(2, '0'), event: (r.e.title.length > 20 ? r.e.title.slice(0, 19) + '…' : r.e.title).toUpperCase(),\n        runtime: this.rt(r.h.quote), edge: r.h.sn ? 'var(--gold)' : 'var(--red)',\n        snip: r.h.quote.length > 110 ? r.h.quote.slice(0, 108).replace(/\\s+\\S*$/, '') + '…' : r.h.quote,\n        remove: () => this.saveCut(s.cut.filter(k => k !== r.key)),\n        up: () => { if (i === 0) return; const c = s.cut.slice(); c.splice(i - 1, 0, c.splice(i, 1)[0]); this.saveCut(c); },\n        down: () => { if (i === s.cut.length - 1) return; const c = s.cut.slice(); c.splice(i + 1, 0, c.splice(i, 1)[0]); this.saveCut(c); }\n      })),\n      cutEmpty: cutRows.length === 0, cutCount: cutRows.length,\n      cutRuntime: fmt(totalSecs), cutPct: Math.min(100, Math.round(totalSecs / 2640 * 100)) + '%',\n      cutTargetLabel: 'OF A 44M EPISODE',\n      clearCut: () => this.saveCut([]),\n      detailOpen: !!selRow, closeDetail: () => this.setState({ sel: null }),\n      detail: selRow ? {\n        quote: selRow.h.quote, book: selRow.h.book, authorLine: selRow.h.author ? '— ' + selRow.h.author : '',\n        edge: selRow.h.sn ? 'var(--gold)' : 'var(--red)', accent: ACCENTS[selRow.ai % 4],\n        eventDate: selRow.e.date.toUpperCase(), eventTitle: selRow.e.title, beat: selRow.e.beat, badgeEp: selRow.e.badgeEp,\n        tagObjs: selRow.h.tags.map(t => ({ t, fg: selRow.h.hotTags.includes(t) ? 'var(--red)' : 'var(--ink3)' })),\n        hasUse: !!selRow.h.use, use: selRow.h.use, hasRw: !!selRow.h.rw, rw: selRow.h.rw,\n        runtime: this.rt(selRow.h.quote), words: this.words(selRow.h.quote),\n        toggleCut: () => this.saveCut(s.cut.includes(selRow.key) ? s.cut.filter(k => k !== selRow.key) : s.cut.concat([selRow.key])),\n        cutBtnLabel: s.cut.includes(selRow.key) ? '− REMOVE FROM CUT' : '+ ADD TO CUT',\n        cutBtnBg: s.cut.includes(selRow.key) ? 'transparent' : 'var(--red)',\n        cutBtnFg: s.cut.includes(selRow.key) ? 'var(--red)' : 'var(--btnfg)',\n        prevNextHint: (idx + 1) + ' / ' + all.length + ' IN THE CORPUS',\n        prev: () => this.setState({ sel: all[Math.max(0, idx - 1)].key }),\n        next: () => this.setState({ sel: all[Math.min(all.length - 1, idx + 1)].key })\n      } : {}\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
