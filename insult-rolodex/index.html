<!doctype html>
<html lang="en" data-threshold="rolodex" data-room-kind="deck" data-room-group="reference" data-custom-room="rolodex">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Insult Rolodex — Chaos Console</title>
<link rel="stylesheet" href="/shared/console-shell.css"><link rel="stylesheet" href="/shared/threshold/rooms/room-base.css"><link rel="stylesheet" href="/insult-rolodex/rolodex.css">
<script defer src="/shared/gate.js"></script><script defer src="/shared/threshold/routes.js"></script><script defer src="/shared/console-shell.js"></script><script defer src="/insult-rolodex/quotes.js"></script><script defer src="/insult-rolodex/rolodex.js"></script>
</head>
<body>
<main id="th-room-content" class="rr-main">
  <header class="rr-intro"><h1>Insult<br>Rolodex</h1><p>For when the right words<br>arrive too late.</p></header>
  <section class="rr-tray" aria-label="Your insult card">
    <div class="rr-categories"><label for="rr-mood">Choose your poison</label><select id="rr-mood" aria-label="Card category"></select></div>
    <div class="rr-stage">
      <div class="rr-back rr-back-one" aria-hidden="true"></div><div class="rr-back rr-back-two" aria-hidden="true"></div>
      <article class="rr-card" id="rr-card" aria-live="polite" aria-atomic="true">
        <div class="rr-card-top"><span id="rr-category"></span><span id="rr-card-id"></span></div>
        <blockquote id="rr-quote" class="rr-quote"></blockquote>
        <div class="rr-card-bottom"><span>Keep this one.</span><button type="button" id="rr-copy" aria-label="Copy this line">Copy <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 4H5a2 2 0 0 0-2 2v11"/></svg></button></div>
        <i class="rr-notch rr-notch-left" aria-hidden="true"></i><i class="rr-notch rr-notch-right" aria-hidden="true"></i>
      </article>
    </div>
    <div class="rr-controls"><button id="rr-prev" class="rr-previous" type="button" aria-label="Previous card"><svg viewBox="0 0 30 24" aria-hidden="true"><path d="M27 12H3m9-9L3 12l9 9"/></svg></button><button id="rr-next" class="rr-next" type="button">Another one <span aria-hidden="true">↻</span></button></div>
  </section>
  <p class="rr-keyboard"><span>← previous</span><span>→ another</span><span>C copy</span></p>
</main>
<div class="rr-toast" id="rr-toast" role="status"></div>
</body></html>
