<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaos Console</title>
<meta name="description" content="Chaos Console — Gerald's private operating readout: debt, body, catalog, production craft, source memory, and the maintenance that keeps it all findable.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<link rel="stylesheet" href="/shared/console-shell.css">
<style>
:root {
  --bg: #0a0e17;
  --bg-2: #0d1220;
  --card: #111826;
  --card-2: #151d2e;
  --line: #1d2740;
  --line-2: #232d45;
  --text: #e5e9f0;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --gold: #d4a052;
  --good: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --sans: "Instrument Sans", Inter, ui-sans-serif, system-ui, sans-serif;
  --disp: "Space Grotesk", var(--sans);
  --mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html { background: var(--bg); scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }

.skip-link {
  position: fixed;
  left: 16px;
  top: 16px;
  z-index: 40;
  transform: translateY(-200%);
  padding: 10px 12px;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  text-decoration: none;
}
.skip-link:focus { transform: translateY(0); }

.shell {
  width: min(1240px, calc(100% - 40px));
  margin: 0 auto;
}

/* ---------- topbar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: 54px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  background: rgba(10, 14, 23, 0.86);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex: none;
}

.mark {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(212, 160, 82, 0.5);
  border-radius: 7px;
  color: var(--gold);
  font-family: var(--disp);
  font-weight: 700;
  font-size: 13px;
}

.wordmark {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.nav {
  display: flex;
  flex: 1;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px 18px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-2);
}
.nav a { text-decoration: none; padding: 4px 0; }
.nav a:hover, .nav a:focus-visible { color: var(--gold); outline: none; }

.top-right {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  flex: none;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
}

.gary {
  padding: 5px 9px;
  border: 1px solid rgba(212, 160, 82, 0.45);
  border-radius: 6px;
  color: var(--gold);
}

/* ---------- header ---------- */
.brief {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  padding: 34px 0 22px;
}

.brief h1 {
  margin: 0;
  font-family: var(--disp);
  font-size: clamp(26px, 3.4vw, 36px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.05;
}

.brief-line {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
}
.brief-line b { color: var(--text-2); font-weight: 500; }

/* ---------- attention ---------- */
.attention {
  border: 1px solid var(--line-2);
  border-radius: 12px;
  background: var(--bg-2);
  overflow: hidden;
}

.attention-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-2);
}
.attention-head .count { color: var(--warn); }

.attn-row {
  display: grid;
  grid-template-columns: 14px minmax(0, 0.62fr) minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  text-decoration: none;
  transition: background 140ms ease;
}
.attn-row:last-child { border-bottom: 0; }
.attn-row:hover, .attn-row:focus-visible { background: var(--card); outline: none; }

.attn-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  justify-self: center;
}
.sev-red .attn-dot { background: var(--bad); box-shadow: 0 0 10px rgba(248, 113, 113, 0.55); }
.sev-amber .attn-dot { background: var(--warn); box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
.sev-info .attn-dot { background: var(--text-3); }

.attn-label { font-weight: 600; font-size: 13.5px; }
.sev-red .attn-label { color: var(--bad); }
.attn-detail { color: var(--text-2); font-size: 12.5px; }
.attn-go { color: var(--text-3); font-family: var(--mono); font-size: 12px; }
.attn-row:hover .attn-go { color: var(--gold); }

/* ---------- KPI band ---------- */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 10px;
  padding: 22px 0 8px;
}

.kpi {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px 16px 13px;
  border: 1px solid var(--line-2);
  border-radius: 12px;
  background: var(--card);
  overflow: hidden;
  text-decoration: none;
  transition: transform 160ms ease, border-color 160ms ease;
}
.kpi::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--k);
  opacity: 0.9;
}
.kpi:hover, .kpi:focus-visible {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--k) 55%, var(--line-2));
  outline: none;
}

.kpi-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
}

.kpi-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.kpi-value {
  font-family: var(--disp);
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
}

.chip {
  padding: 2px 7px;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.chip.good { color: var(--good); background: rgba(74, 222, 128, 0.1); }
.chip.warn { color: var(--warn); background: rgba(251, 191, 36, 0.1); }
.chip.bad  { color: var(--bad);  background: rgba(248, 113, 113, 0.12); }
.chip.flat { color: var(--text-2); background: rgba(148, 163, 184, 0.1); }

.kpi svg { display: block; width: 100%; height: 30px; }

.kpi-note {
  font-size: 11px;
  line-height: 1.45;
  color: var(--text-3);
}

/* ---------- clusters ---------- */
.cluster { padding: 26px 0 4px; }

.cluster-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
  padding-bottom: 12px;
}

.cluster-head h2 {
  margin: 0;
  font-family: var(--disp);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.cluster-head p {
  margin: 0;
  font-size: 12.5px;
  color: var(--text-3);
}

.room-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 10px;
}

.room {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px 16px 13px;
  border: 1px solid var(--line-2);
  border-radius: 12px;
  background: var(--card);
  overflow: hidden;
}
.room::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--k);
  opacity: 0.9;
}

.room-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.room-head a {
  font-family: var(--disp);
  font-size: 16.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-decoration: none;
}
.room-head a::after { content: ""; position: absolute; inset: 0; }
.room:hover { border-color: color-mix(in srgb, var(--k) 50%, var(--line-2)); }
.room:hover .room-open { color: var(--k); }

.stamp {
  position: relative;
  z-index: 1;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}
.stamp.good { color: var(--good); }
.stamp.warn { color: var(--warn); }
.stamp.bad  { color: var(--bad); }
.stamp.idle { color: var(--text-3); }

.room-tagline {
  margin: -4px 0 0;
  font-size: 12px;
  color: var(--text-3);
}

.room-stats { display: grid; gap: 7px; }

.stat {
  display: grid;
  gap: 1px;
  padding-top: 7px;
  border-top: 1px solid var(--line);
}

.stat-line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}

.stat-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
}

.stat-value {
  font-family: var(--disp);
  font-size: 13.5px;
  font-weight: 600;
  text-align: right;
}

.stat-sub {
  font-size: 11px;
  color: var(--text-3);
  text-align: right;
}

.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

.swatch {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-2);
}
.swatch i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--sw);
}
.swatch small { color: var(--text-3); font-size: 9.5px; }

.room-spark { margin-top: 2px; }
.room-spark svg { display: block; width: 100%; height: 38px; }

.spark-cap {
  margin-top: 3px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
}
.spark-cap i {
  display: inline-block;
  width: 8px; height: 2px;
  margin-right: 5px;
  vertical-align: middle;
  border-radius: 2px;
  background: var(--sw);
  font-style: normal;
}
.spark-cap span + span { margin-left: 12px; }

.room-links {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: auto;
  padding-top: 10px;
}

.room-links a {
  padding: 4px 9px;
  border: 1px solid var(--line-2);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--text-2);
  text-decoration: none;
  transition: color 140ms ease, border-color 140ms ease;
}
.room-links a:hover, .room-links a:focus-visible {
  color: var(--k);
  border-color: color-mix(in srgb, var(--k) 60%, var(--line-2));
  outline: none;
}

.room-open {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
}

/* ---------- quote strip ---------- */
.resurface {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 26px;
  align-items: center;
  margin: 28px 0 4px;
  padding: 22px 24px;
  border: 1px solid var(--line-2);
  border-radius: 12px;
  background: linear-gradient(135deg, var(--bg-2), var(--card));
}

.rs-quote {
  margin: 0;
  font-family: "Fraunces", Georgia, serif;
  font-style: italic;
  font-size: clamp(16px, 2vw, 20px);
  font-weight: 500;
  line-height: 1.45;
  color: var(--text);
}
.rs-quote::before { content: "\201C\2009"; color: var(--gold); }
.rs-quote::after { content: "\2009\201D"; color: var(--gold); }

.rs-meta {
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
}

.rs-actions { display: grid; gap: 8px; }

.rs-actions button,
.rs-actions a {
  min-width: 132px;
  padding: 8px 14px;
  border: 1px solid var(--line-2);
  border-radius: 7px;
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-align: center;
  text-transform: uppercase;
  text-decoration: none;
  transition: color 140ms ease, border-color 140ms ease;
}
.rs-actions button:hover, .rs-actions a:hover,
.rs-actions button:focus-visible, .rs-actions a:focus-visible {
  color: var(--gold);
  border-color: rgba(212, 160, 82, 0.5);
  outline: none;
}

/* ---------- footer ---------- */
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 24px;
  flex-wrap: wrap;
  margin-top: 30px;
  padding: 20px 0 30px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
}

.annex { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.annex a { text-decoration: none; color: var(--text-2); }
.annex a:hover, .annex a:focus-visible { color: var(--fk, var(--gold)); outline: none; }
.annex a i {
  display: inline-block;
  width: 7px; height: 7px;
  margin-right: 6px;
  border-radius: 50%;
  background: var(--fk, var(--text-3));
  font-style: normal;
  opacity: 0.85;
}

.credo { color: var(--gold); }

@media (max-width: 860px) {
  .attn-row { grid-template-columns: 14px minmax(0, 1fr) auto; grid-template-rows: auto auto; }
  .attn-dot { grid-column: 1; grid-row: 1; }
  .attn-label { grid-column: 2; grid-row: 1; }
  .attn-detail { grid-column: 2; grid-row: 2; }
  .attn-go { grid-column: 3; grid-row: 1 / 3; }
  .resurface { grid-template-columns: 1fr; }
  .rs-actions { grid-auto-flow: column; }
}

@media (max-width: 620px) {
  .shell { width: calc(100% - 28px); }
  .topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
  .brand { grid-column: 1; grid-row: 1; }
  .top-right { grid-column: 2; grid-row: 1; justify-self: end; }
  .nav { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; padding-bottom: 6px; }
  .brief { padding-top: 24px; }
  .room-grid { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .rs-actions { grid-auto-flow: row; }
}
</style>
<script defer src="/shared/gate.js"></script>
<script defer src="/shared/console-shell.js"></script>

(function () {
  "use strict";

  var NOW = Date.now();
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };

  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function shortDate(iso) {
    if (!iso) return "";
    var p = iso.split("-");
    return MONTHS[+p[1] - 1] + " " + (+p[2]);
  }

  function freshness(room) {
    if (room.flag === "attention") return { cls: "bad", txt: "needs attention" };
    var ref = room.dataThrough || room.updated;
    if (!ref) return { cls: "idle", txt: "" };
    var age = Math.max(0, Math.floor((NOW - new Date(ref + "T12:00:00").getTime()) / 864e5));
    if (!room.cadenceDays) return { cls: "idle", txt: "updated " + shortDate(room.updated || ref) };
    var r = age / room.cadenceDays;
    if (r <= 1) return { cls: "good", txt: "fresh · " + age + "d" };
    if (r <= 2) return { cls: "warn", txt: "due · " + age + "d" };
    return { cls: "bad", txt: "stale · " + age + "d" };
  }

  /* series: [{points:[[t,v],...], color, dashed}] normalized on a shared scale */
  function sparkSVG(seriesArr, height, fill) {
    var W = 100, H = 28, P = 2.5;
    var vals = [];
    seriesArr.forEach(function (s) { s.points.forEach(function (p) { vals.push(p[1]); }); });
    if (!vals.length) return "";
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || 1;
    var out = "";
    seriesArr.forEach(function (s, si) {
      var n = s.points.length;
      if (n < 2) return;
      var pts = s.points.map(function (p, i) {
        var x = P + i * (W - 2 * P) / (n - 1);
        var y = H - P - (p[1] - min) / span * (H - 2 * P);
        return [x.toFixed(2), y.toFixed(2)];
      });
      var poly = pts.map(function (q) { return q.join(","); }).join(" ");
      if (fill && si === 0) {
        out += '<polygon points="' + P + ',' + (H - P) + ' ' + poly + ' ' + (W - P) + ',' + (H - P) +
          '" fill="' + s.color + '" opacity="0.09"></polygon>';
      }
      out += '<polyline points="' + poly + '" fill="none" stroke="' + s.color +
        '" stroke-width="1.6" vector-effect="non-scaling-stroke"' +
        (s.dashed ? ' stroke-dasharray="3 3"' : "") + ' stroke-linejoin="round" stroke-linecap="round"></polyline>';
      var last = pts[pts.length - 1];
      out += '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="1.9" fill="' + s.color + '"></circle>';
    });
    return '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" style="height:' +
      height + 'px" aria-hidden="true">' + out + "</svg>";
  }

  function render(m) {
    /* header line */
    document.getElementById("briefLine").innerHTML =
      "Readout <b>" + esc(shortDate(m.generated)) + "</b> · <b>" + m.rooms.length +
      " rooms</b> · <b>" + m.attention.length + " flags</b> on the board";
    document.getElementById("stampLine").textContent =
      "readout v" + (m.version || 2) + " · " + m.generated;

    /* attention */
    document.getElementById("attnCount").textContent = m.attention.length + " open";
    document.getElementById("attnList").innerHTML = m.attention.map(function (a) {
      return '<a class="attn-row sev-' + esc(a.severity) + '" href="' + esc(a.href) + '">' +
        '<span class="attn-dot" aria-hidden="true"></span>' +
        '<span class="attn-label">' + esc(a.label) + "</span>" +
        '<span class="attn-detail">' + esc(a.detail) + "</span>" +
        '<span class="attn-go" aria-hidden="true">-&gt;</span></a>';
    }).join("");

    /* KPI band */
    document.getElementById("kpiBand").innerHTML = m.kpis.map(function (k) {
      var spark = k.spark && k.spark.length > 1
        ? sparkSVG([{ points: k.spark.map(function (v, i) { return [i, v]; }), color: k.color }], 30, true)
        : "";
      return '<a class="kpi" href="' + esc(k.href) + '" style="--k:' + esc(k.color) + '">' +
        '<span class="kpi-label">' + esc(k.label) + "</span>" +
        '<span class="kpi-line"><span class="kpi-value">' + esc(k.value) + "</span>" +
        '<span class="chip ' + esc(k.tone || "flat") + '">' + esc(k.delta) + "</span></span>" +
        spark +
        '<span class="kpi-note">' + esc(k.note) + "</span></a>";
    }).join("");

    /* clusters */
    var byCluster = {};
    m.rooms.forEach(function (r) { (byCluster[r.cluster] = byCluster[r.cluster] || []).push(r); });

    document.getElementById("clusters").innerHTML = m.clusters.map(function (c) {
      var rooms = byCluster[c.key] || [];
      var cards = rooms.map(function (r) {
        var st = freshness(r);
        var stats = (r.stats || []).map(function (s) {
          return '<div class="stat"><div class="stat-line">' +
            '<span class="stat-label">' + esc(s.label) + "</span>" +
            '<span class="stat-value">' + esc(s.value) + "</span></div>" +
            (s.sub ? '<div class="stat-sub">' + esc(s.sub) + "</div>" : "") + "</div>";
        }).join("");

        var swatches = r.swatches && r.swatches.length
          ? '<div class="swatches">' + r.swatches.map(function (w) {
              return '<span class="swatch" style="--sw:' + esc(w.hex) + '"><i></i>' +
                esc(w.name) + " <small>" + esc(w.sub) + "</small></span>";
            }).join("") + "</div>"
          : "";

        var sparkBlock = "";
        if (r.series && r.series.length) {
          var palette = r.series.length > 1 ? ["#64748b", r.color] : [r.color];
          var sers = r.series.map(function (s, i) {
            return { points: s.points, color: palette[i % palette.length], dashed: r.series.length > 1 && i === 0 };
          });
          var cap = r.series.map(function (s, i) {
            return '<span><i style="--sw:' + palette[i % palette.length] + '"></i>' + esc(s.label) + "</span>";
          }).join("");
          sparkBlock = '<div class="room-spark">' + sparkSVG(sers, 38, r.series.length === 1) +
            '<div class="spark-cap">' + cap + "</div></div>";
        }

        var links = (r.links || []).map(function (l) {
          return '<a href="' + esc(l.href) + '">' + esc(l.label) + "</a>";
        }).join("");

        return '<article class="room" style="--k:' + esc(r.color) + '">' +
          '<div class="room-head"><a href="' + esc(r.href) + '">' + esc(r.label) + "</a>" +
          '<span class="stamp ' + st.cls + '">' + esc(st.txt) + "</span></div>" +
          (r.tagline ? '<p class="room-tagline">' + esc(r.tagline) + "</p>" : "") +
          '<div class="room-stats">' + stats + "</div>" + swatches + sparkBlock +
          '<div class="room-links">' + links + '<span class="room-open" aria-hidden="true">open -&gt;</span></div>' +
          "</article>";
      }).join("");

      return '<section class="cluster" aria-label="' + esc(c.title) + '">' +
        '<div class="cluster-head"><h2>' + esc(c.title) + "</h2><p>" + esc(c.blurb) + "</p></div>" +
        '<div class="room-grid">' + cards + "</div>" +
        (c.key === "ops" ? quoteStrip(m) : "") +
        "</section>";
    }).join("");

    /* footer annex */
    document.getElementById("annex").innerHTML = (m.annex || []).map(function (x) {
      return '<a href="' + esc(x.href) + '" style="--fk:' + esc(x.color) + '"><i></i>' +
        esc(x.label) + " · " + esc(x.metric) + "</a>";
    }).join("");

    wireQuote(m);
  }

  /* ---------- resurface strip ---------- */
  function quoteStrip(m) {
    var qs = m.quote_stats || {};
    return '<div class="resurface" aria-live="polite">' +
      '<div><p class="rs-quote" id="rsQuote"></p>' +
      '<p class="rs-meta" id="rsMeta"></p></div>' +
      '<div class="rs-actions">' +
      '<button type="button" id="rsBtn">Resurface</button>' +
      '<a href="/readwise-highlights/">Open the shelf</a>' +
      "</div></div>";
  }

  var currentQuote = null;
  function wireQuote(m) {
    var pool = m.quotes || [];
    var qEl = document.getElementById("rsQuote");
    var mEl = document.getElementById("rsMeta");
    var btn = document.getElementById("rsBtn");
    if (!qEl || !pool.length) return;
    var qs = m.quote_stats || {};

    function pick() {
      var options = pool.filter(function (q) { return q !== currentQuote; });
      if (!options.length) options = pool;
      return options[Math.floor(Math.random() * options.length)];
    }
    function show(q) {
      currentQuote = q;
      qEl.textContent = q.text;
      mEl.textContent = q.author + (q.source ? " · " + q.source : "") +
        (qs.highlights ? "  ·  1 of " + qs.highlights.toLocaleString() + " banked" : "");
    }
    show(pick());
    if (btn) btn.onclick = function () { show(pick()); };
  }

  /* ---------- boot ---------- */
  var d = new Date();
  var DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  document.getElementById("today").textContent =
    DAYS[d.getDay()] + " · " + MONTHS[d.getMonth()].toUpperCase() + " " + d.getDate();

  render(FALLBACK);
  fetch("/data/console-status.json")
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (m) { if (m && m.version >= 2) render(m); })
    .catch(function () { /* fallback already rendered */ });
})();
</script>
